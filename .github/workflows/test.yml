name: test
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check-version
      - run: npm run check-vendor-version
        # Launch-readiness audit (DEPENDENCY_AUDIT.md): both scripts already
        # existed and both pass today, but neither ran anywhere - a missed
        # APP_VERSION/SW_VERSION bump or vendor/package.json drift on
        # @supabase/supabase-js shipped silently until caught by hand.
      - run: npm audit --audit-level=high
        # Same audit, same finding: 0 vulnerabilities today, but nothing
        # gated a future one. audit-level=high so a low/moderate advisory
        # with no fix available yet does not block every push.

  # Launch-readiness audit, DEP-4. The three Edge Functions import
  # @supabase/supabase-js straight from esm.sh at a pinned version, but had
  # no lockfile - so the exact bytes behind that URL were never verified,
  # and a compromised or re-published module would have been picked up
  # silently on the next deploy. deno.lock records a sha256 per remote
  # module; --frozen fails the build if the resolved graph no longer
  # matches, which is the whole control.
  edge-function-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.x
      - name: verify each Edge Function against its lockfile
        run: |
          for fn in supabase/functions/*/; do
            [ -f "$fn/index.ts" ] || continue
            echo "--- $fn"
            (cd "$fn" && deno cache --frozen --lock=deno.lock index.ts)
          done

  browser-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: scripts/browser-check
      - run: npx playwright install --with-deps chromium
        working-directory: scripts/browser-check
      - run: node run-all.mjs
        working-directory: scripts/browser-check
  migration-check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so check-migration-immutability.mjs can resolve a real
      # merge base; the default shallow clone has no history to compare to
      # and the check would skip itself.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # Launch-readiness audit, INFRASTRUCTURE_AUDIT.md. Was `latest` -
          # the one unpinned component in an otherwise fully SHA-pinned
          # workflow, sitting on the job that gates every schema change. A
          # CLI release could change migration behaviour underneath this
          # gate with no commit in this repo. Pinned to the version the
          # audit actually verified the full suite against (79 files, 2747
          # pgTAP assertions, PASS).
          version: 2.116.0
      # Migrations are immutable once applied - Supabase tracks them by
      # filename, so an edit to an already-applied file diverges local from
      # production silently. Runs BEFORE the stack starts: it is a cheap
      # git-only check and there is no point booting Postgres to then fail.
      - run: node scripts/check-migration-immutability.mjs
      - run: supabase start
        # Applies every file in supabase/migrations/, in order, against a
        # throwaway local Postgres + Auth + Storage stack. Fails the build
        # on the first migration that doesn't apply cleanly, so a broken
        # migration is caught here instead of against the real project.
      - run: supabase test db
        # Runs the pgTAP suite in supabase/tests/ against that same stack.
        # Each NNNN_slug_test.sql impersonates two auth users in one
        # transaction and asserts RLS allow or deny for real, per the
        # boundary list in docs/community/backlog.md. This is coverage the
        # static assertions in test/community-rls-boundaries.test.mjs cannot
        # give, since the JS mock has no policy engine. pgTAP ships in the
        # Supabase images.
